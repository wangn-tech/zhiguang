spring:
  application:
    name: zhiguang
  datasource:
    url: jdbc:mysql://localhost:3306/zhiguang?useSSL=false&allowPublicKeyRetrieval=true&connectionTimeZone=SERVER
    username: zhiguang
    password: zhiguang_dev
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      idle-timeout: 600000
      max-lifetime: 1700000
      keepalive-time: 300000
      connection-timeout: 30000
  data:
    redis:
      host: localhost
      port: 6379
      password: zhiguang_redis_dev
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      retries: 3
      properties:
        enable.idempotence: true
    consumer:
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      enable-auto-commit: false
      auto-offset-reset: earliest
    listener:
      ack-mode: manual
  jackson:
    serialization:
      write-dates-as-timestamps: false
  servlet:
    multipart:
      max-file-size: ${storage.oss.avatar-max-size}
      max-request-size: 6MB

mybatis:
  mapper-locations: classpath*:mapper/*.xml
  configuration:
    map-underscore-to-camel-case: true

auth:
  jwt:
    issuer: zhiguang
    key-id: zhiguang-key
    access-token-ttl: PT15M
    refresh-token-ttl: P7D
    private-key: classpath:keys/private.pem
    public-key: classpath:keys/public.pem
  verification:
    code-length: 6
    ttl: PT5M
    max-attempts: 5
    send-interval: PT60S
    daily-limit: 10
  password:
    bcrypt-strength: 12
    min-length: 8
    max-length: 64
  cors:
    allowed-origins:
      - http://localhost:5173

storage:
  oss:
    enabled: ${OSS_ENABLED:false}
    region: ${OSS_REGION:}
    endpoint: ${OSS_ENDPOINT:}
    bucket: ${OSS_BUCKET:}
    public-base-url: ${OSS_PUBLIC_BASE_URL:}
    avatar-max-size: 5MB
    presign-ttl: PT10M

knowpost:
  snowflake:
    datacenter-id: ${SNOWFLAKE_DATACENTER_ID}
    worker-id: ${SNOWFLAKE_WORKER_ID}

relation:
  events:
    # 本地启动依赖后通过 RELATION_EVENTS_ENABLED=true 显式启用 Canal/Kafka 消费链路。
    enabled: ${RELATION_EVENTS_ENABLED:false}
    topic: canal-outbox
    consumer-group: relation-outbox-consumer
    dedup-ttl: P7D
    cache-ttl: PT2H
    canal:
      host: ${CANAL_HOST:localhost}
      port: ${CANAL_PORT:11111}
      destination: ${CANAL_DESTINATION:zhiguang}
      username: ${CANAL_USERNAME:canal}
      password: ${CANAL_PASSWORD:canal}
      filter: zhiguang\.outbox
      batch-size: 1000
      poll-interval: PT1S

counter:
  events:
    # Kafka 未启动时保持关闭；启用后互动状态变化会异步折叠为知文计数。
    enabled: ${COUNTER_EVENTS_ENABLED:false}
    topic: counter-events
    consumer-group: counter-aggregation
    dedup-ttl: P7D
    flush-interval: PT1S
    flush-batch-size: 100

cache:
  l1:
    detail-ttl: PT30S
    detail-max-size: 5000
    public-feed-ttl: PT15S
    public-feed-max-size: 1000
    mine-feed-ttl: PT10S
    mine-feed-max-size: 1000
  l2:
    detail-ttl: PT10M
    public-feed-ttl: PT2M
    mine-feed-ttl: PT1M

search:
  # 本地未启动 Elasticsearch 时保持关闭；启用搜索时设置 SEARCH_ENABLED=true。
  enabled: ${SEARCH_ENABLED:false}
  uri: ${SEARCH_URI:http://localhost:9200}
  index-alias: zhiguang_knowpost
  index-name: zhiguang_knowpost_v1
  rebuild-on-startup: ${SEARCH_REBUILD_ON_STARTUP:false}
  rebuild-batch-size: 500
  max-body-bytes: 65536
  events:
    # 搜索消费者复用 relation.events 的 Canal Outbox Topic；本地默认随 RELATION_EVENTS_ENABLED 一同关闭。
    enabled: ${SEARCH_EVENTS_ENABLED:${RELATION_EVENTS_ENABLED:false}}
    consumer-group: search-indexer
