name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  JAVA_VERSION: "21"
  NODE_VERSION: "22"

jobs:
  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository and frontend submodule
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Type-check
        working-directory: frontend
        run: npm run lint

      - name: Build
        working-directory: frontend
        run: npm run build

  backend:
    name: Backend
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      mysql:
        image: mysql:8.4.11
        ports:
          - 3306:3306
        env:
          MYSQL_DATABASE: zhiguang
          MYSQL_USER: zhiguang
          MYSQL_PASSWORD: zhiguang_ci
          MYSQL_ROOT_PASSWORD: zhiguang_root_ci
          TZ: Asia/Shanghai
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -uroot -pzhiguang_root_ci --silent"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

      redis:
        image: redis:8.4.5-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven
          cache-dependency-path: backend/pom.xml

      - name: Build Elasticsearch test image with IK
        run: docker build --tag zhiguang-elasticsearch:9.2.1 --file deploy/elasticsearch/Dockerfile .

      - name: Test and build backend
        working-directory: backend
        shell: bash
        env:
          # Full-context tests use the application defaults; CI provides only the
          # two dependencies required by those tests. Testcontainers tests override
          # these values through @DynamicPropertySource.
          SPRING_DATASOURCE_URL: jdbc:mysql://127.0.0.1:3306/zhiguang?useSSL=false&allowPublicKeyRetrieval=true&connectionTimeZone=SERVER
          SPRING_DATASOURCE_USERNAME: zhiguang
          SPRING_DATASOURCE_PASSWORD: zhiguang_ci
          SPRING_DATA_REDIS_HOST: 127.0.0.1
          SPRING_DATA_REDIS_PORT: "6379"
          # GitHub Actions Redis service uses its image default without a password.
          SPRING_DATA_REDIS_PASSWORD: ""
        run: |
          if [[ -f mvnw ]]; then
            chmod +x mvnw
            ./mvnw --batch-mode --no-transfer-progress verify
          else
            mvn --batch-mode --no-transfer-progress verify
          fi
